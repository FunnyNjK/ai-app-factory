name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown-quality:
    name: Markdown Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            **/*.mdc

  factory-validation:
    name: Factory Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate factory artifacts
        run: node scripts/validate-factory.mjs

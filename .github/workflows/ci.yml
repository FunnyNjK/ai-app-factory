name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown-quality:
    name: Markdown Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            **/*.mdc

  policy-check:
    name: Factory Policy Presence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required factory files exist
        run: |
          set -euo pipefail
          required_files=(
            README.md
            MANIFEST.md
            OPERATING_MODEL.md
            CLAUDE.md
            AGENTS.md
            standards/coding-standards.md
            standards/testing-standards.md
            standards/security-standards.md
            standards/api-standards.md
            standards/ci-cd-standards.md
            standards/documentation-standards.md
            templates/PROJECT.md
            templates/ARCHITECTURE.md
            templates/API_SPEC.md
            templates/SECURITY.md
            templates/TEST_PLAN.md
            templates/RELEASE_CHECKLIST.md
            templates/RUNBOOK.md
            templates/.env.example
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          echo "All required factory files are present."
